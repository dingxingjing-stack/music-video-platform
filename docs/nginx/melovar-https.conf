# Melovar · HTTPS（443）站点配置 —— **规范副本**
#
# 生效位置：/etc/nginx/sites-available/melovar-https
# 服务器上的"模板"：/opt/melovar/nginx/melovar-https.conf
#
# ⚠️ 三处必须保持一致，否则 enable-https.sh 会用旧模板覆盖生效配置：
#      docs/nginx/melovar-https.conf（本文件）  ← 唯一可信来源
#      /opt/melovar/nginx/melovar-https.conf
#      /etc/nginx/sites-available/melovar-https
#
# 变更历史
#   2026-09-29  root 修正为 /opt/melovar/frontend/current（模板曾写历史目录 /opt/melovar/web，
#               该目录不被 nginx 使用，直接跑 enable-https.sh 会把站点打挂）。
#   2026-09-29  新增 /share/ 的**爬虫分流**：详见下方 location ~ ^/share/ 注释。

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name melovar.com;

    ssl_certificate     /etc/letsencrypt/live/melovar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/melovar.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /opt/melovar/frontend/current;
    index index.html;
    client_max_body_size 100m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_buffering off;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        access_log off;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
        try_files $uri =404;
    }
    location ~* ^/workbox-[A-Za-z0-9_-]+\.js$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── 分享链接：把**平台爬虫**分流到后端的服务端渲染页 ───────────────────────
    # 为什么需要：
    #   /share/<token> 平时由 React SPA 提供，而 SPA 是静态 index.html —— 所有 meta
    #   都是站点级固定值。微信 / X / Facebook / WhatsApp / Telegram / Discord 的链接
    #   卡片，是平台**爬虫抓 HTML、不执行 JS** 生成的，于是每条分享链接的卡片长得
    #   完全一样、而且没有 og:image。后端 /share/{token} 会按令牌渲染真正的
    #   og:title / og:description / og:image（见 backend/app/routers/share_page.py），
    #   这里只负责把爬虫引过去。真人继续走 SPA（有播放器、平台按钮、封面卡下载）。
    #
    # 为什么是 418 + error_page：
    #   SPA 用 try_files 兜底 /index.html，对爬虫同样返回 200，无法按状态码改写；
    #   而 if 块里不允许写 proxy_pass。用一个显式错误码触发内部重定向是最稳的写法。
    #
    # 为什么**不**匹配搜索爬虫（Googlebot / bingbot / Yandex / Applebot / Semrush 等）：
    #   给搜索引擎爬虫和真人返回不同 HTML 有 cloaking 风险，而分享卡片跟 SEO 无关。
    #   这里只列**社交 / 链接预览**爬虫。
    #
    # 为什么**不**匹配 MicroMessenger（微信）与 Line：
    #   它们「链接预览抓取」和「App 内浏览器」的 UA **完全一样，无法区分**。若一并
    #   分流，微信内打开分享链接的用户只会看到静态页、没有播放器 —— 得不偿失。
    #   微信自定义卡片的正确做法是公众号 JS-SDK（需 appId + 签名，属独立工程）。
    #   现状：微信内浏览器走 SPA，卡片图回落到 index.html 的站点级 og:image。
    #
    # 为什么**不**匹配 iOS/Android WebView：
    #   同上——包里打开的都是真人，需要播放器。
    location ~ ^/share/ {
        error_page 418 = @share_og;
        if ($http_user_agent ~* "facebookexternalhit|Facebot|Twitterbot|TelegramBot|WhatsApp|Slackbot|Discordbot|LinkedInBot|Pinterest|redditbot|SkypeUriPreview|Embedly|Quora|vkShare|Tumblr|Bitlybot|Nuzzel|Outbrain|Xing|Bytespider|Iframely") {
            return 418;
        }
        try_files $uri $uri/ /index.html;
    }

    # 418 的落点：把原始 URI（/share/<token>）原样交给后端。
    # proxy_pass 不带 URI 部分 ⇒ 透传 $request_uri，无需 rewrite。
    location @share_og {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # 分享页据此决定 og:description 出中文还是英文
        proxy_set_header Accept-Language   $http_accept_language;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
