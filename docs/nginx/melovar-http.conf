# Melovar · HTTP（80）站点配置 —— **规范副本**
#
# 生效位置：/etc/nginx/sites-available/melovar
#
# 现状说明（2026-09-29 核实）：
#   本文件仍是「IP 测试期（仅 HTTP）」形态 —— 它**直接服务 SPA 与 API**，不是纯跳转。
#   /opt/melovar/nginx/melovar-http-redirect.conf（纯 301 跳转版）**存在但从未安装**，
#   因为 enable-https.sh 从未执行（443 块是手工启用的）。
#   ⇒ 影响：http://melovar.com 目前不作强制跳转。属独立待办，不在分享改造范围内，
#      故此处保持与线上一致，只叠加 /share/ 的跳转。
#
# 变更历史
#   2026-09-29  新增 location ~ ^/share/ → 301 https：443 块才会按 UA 分流爬虫
#               （见 docs/nginx/melovar-https.conf）。用跳转而不是复制一份 UA 正则，
#               是为了避免两处正则漂移。顺带把 /share/ 的人流量也推到 HTTPS。

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name melovar.com 47.88.16.83 _;

    root /opt/melovar/frontend/current;
    index index.html;

    # 音频/参考素材上传接口需要较大 body
    client_max_body_size 100m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # ACME 挑战目录（HTTP-01 兜底；DNS-01 不依赖它）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    # ---- API：路径与 Render 时期完全一致，前端无需改代码 ----
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 音乐生成/音频处理接口耗时较长
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_buffering off;
    }

    # ---- WebSocket：/ws/progress/{task_id} ----
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- 后端自证健康（迁移验收要用它确认连的是哪个库） ----
    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        access_log off;
    }

    # Service Worker 绝不能长缓存，否则自动更新失效
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
        try_files $uri =404;
    }
    location ~* ^/workbox-[A-Za-z0-9_-]+\.js$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # 带哈希的构建产物可长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- 分享链接：一律升到 HTTPS ----
    # 爬虫分流只在 443 块里做（按 UA 走 @share_og），此处只需把人/爬虫都推过去。
    location ~ ^/share/ {
        return 301 https://melovar.com$request_uri;
    }

    # ---- SPA 回退 ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
