services:
  - type: web
    name: ai-music-backend
    runtime: docker
    plan: free
    region: oregon
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      # Core
      - key: ENVIRONMENT
        value: production
      # Database
      - key: DATABASE_URL
        sync: false
      # LLM / AI
      - key: AGNES_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      # Fal.ai (primary production music generation)
      - key: FAL_KEY
        sync: false
      - key: FAL_API_KEY
        sync: false
      - key: FAL_MODEL
        value: "fal-ai/stable-audio"
      - key: FAL_TIMEOUT
        value: "300"
      - key: FAL_POLL_INTERVAL
        value: "2"
      - key: FAL_BUDGET_DAILY
        value: "30"
      # TTS / Workflow modes
      - key: TTS_BACKEND_MODE
        value: "mock"
      - key: WORKFLOW_MODE
        value: "real"
      # Supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # R2 / CDN
      - key: CDN_BUCKET
        sync: false
      - key: CDN_BASE_URL
        sync: false
      - key: CLOUDFLARE_R2_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_R2_ACCESS_KEY
        sync: false
      - key: CLOUDFLARE_R2_SECRET_KEY
        sync: false
      # Supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Sentry
      - key: SENTRY_DSN
        sync: false
      # LLM Providers
      - key: AGNES_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Budgets
      - key: FAL_BUDGET_DAILY
        value: "30"